<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
<script defer src="to-do.js"></script>

</head>
<body>
    <h1>To-Do List</h1>

    <div id="content">
        <div id="task">

        <input type="text" id="taskInput" placeholder="Digite uma nova tarefa">
        <input type="date" id="taskDateInput" placeholder="DD/MM/AAAA">
        <button id="btn-task">Adicionar Tarefa</button>

        </div>
        <div id="taskList">
            <ul id="tasks"></ul>
        </div>
    </div>
</body>
</html>
